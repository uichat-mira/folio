name: Validate

on:
  pull_request:
    branches:
      - dev
      - test
      - prod
  push:
    branches:
      - "feat/**"
      - dev
      - test
      - prod
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run release:check

  windows-package-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @uichat-mira/folio
      - run: npm run pack:verify -w @uichat-mira/folio
