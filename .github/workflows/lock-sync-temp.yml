name: Temporary lockfile sync

on:
  push:
    branches:
      - feat/markdown-enhancers
    paths:
      - packages/folio/package.json
      - .github/workflows/lock-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/markdown-enhancers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/lock-sync-temp.yml
          git commit -m "chore: sync markdown enhancer lockfile"
          git push origin HEAD:feat/markdown-enhancers
