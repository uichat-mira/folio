name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release package
        run: npm run release:check

      - name: Verify release tag and production lineage
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./packages/folio/package.json').version")
          # Legacy v0.1.0 belongs to MiraDocs; Folio tags use a distinct prefix.
          test "${RELEASE_TAG}" = "folio-v${VERSION}"

          git fetch origin prod --no-tags
          TAG_COMMIT=$(git rev-list -n 1 "${RELEASE_TAG}")
          git merge-base --is-ancestor "${TAG_COMMIT}" origin/prod

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version already exists
        id: registry
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          if npm view "@uichat-mira/folio@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@uichat-mira/folio@${VERSION} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @uichat-mira/folio with npm Trusted Publishing
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/folio
        run: npm publish --access public

      # npm scans new packages before making them installable; the scan may take
      # 15+ minutes. Poll the real public Registry without weakening the
      # independent package/SRI/consumer verification that follows.
      # https://github.blog/changelog/2026-07-28-npm-publish-time-malware-scanning-and-dual-use-metadata/
      - name: Verify public Registry install and consumer behavior
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          for attempt in $(seq 1 60); do
            if npm view "@uichat-mira/folio@${VERSION}" dist.integrity --registry=https://registry.npmjs.org --fetch-retries=0 2>/dev/null | grep -q '^sha512-'; then
              echo "@uichat-mira/folio@${VERSION} is visible in the public Registry (probe ${attempt}/60)."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Published @uichat-mira/folio@${VERSION} is not installable after 30 minutes; inspect npm publish-time scan status"
              exit 1
            fi
            echo "Waiting for @uichat-mira/folio@${VERSION} to clear npm scanning (probe ${attempt}/60)"
            sleep 30
          done
          npm run registry:consumer -w @uichat-mira/folio

      - name: Record release result
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          if [ "${{ steps.registry.outputs.published }}" = "true" ]; then
            echo "### @uichat-mira/folio@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "The version already existed on npm, so publishing was safely skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### @uichat-mira/folio@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "Published from the prod release lineage through npm Trusted Publishing (OIDC)." >> "$GITHUB_STEP_SUMMARY"
          fi
