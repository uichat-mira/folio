name: Folio 1107 preview (Cloudflare Pages)

on:
  push:
    branches:
      - preview/folio-1107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-preview-1107
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build isolated preview at site root
        run: |
          npm ci --no-audit --no-fund
          GITHUB_REPOSITORY='' npm run build
          test -s apps/site/dist/index.html
      - name: Deploy isolated Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2d8b3ad301699892491d5a95b9c962a2
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not available to this repository."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy apps/site/dist --project-name folio-preview --branch preview/folio-1107
      - name: Smoke preview root
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://folio-preview-4o4.pages.dev/ -o /tmp/folio-preview.html
          grep -q 'Folio' /tmp/folio-preview.html
