name: Preview Folio dev on Cloudflare Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-dev-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: folio-dev-preview
      url: https://folio-dev-preview.pages.dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build Folio site
        env:
          FOLIO_SITE_BASE: /
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy isolated dev preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2d8b3ad301699892491d5a95b9c962a2
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          npx --yes wrangler@4 pages deploy apps/site/dist --project-name folio-dev-preview --branch dev --commit-hash "$GITHUB_SHA"
